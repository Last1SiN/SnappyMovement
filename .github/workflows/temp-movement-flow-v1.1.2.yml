name: Temporary SnappyMovement movement-flow candidate v1.1.2

on:
  push:
    branches:
      - feature-movement-flow-v1.1.2

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate dual-finalizer candidate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import ast, hashlib, tomllib, zipfile

          source = Path("__init__.py")
          text = source.read_text(encoding="utf-8")
          tree = ast.parse(text, filename=str(source))
          compile(text, str(source), "exec")

          required = (
              'display_name="Remember Sprint"',
              'display_name="Slide from Landing"',
              '/Game/PlayerCharacters/_Shared/_Design/Character/BPChar_Player.BPChar_Player_C:OnLanded',
              'Type.POST',
              '@hook("/Script/Engine.Character:K2_OnMovementModeChanged", Type.POST)',
              '@hook("/Script/Engine.CharacterMovementComponent:SetMovementMode", Type.POST)',
              '_air_slide_intent',
              'landing captured POST',
              'SetWantsToSlide requested=',
              'Slide from Landing requested',
              'Remember Sprint restored after',
              '[SnappyMovement test] OnJumped',
              '[SnappyMovement test] OnStartSprinting',
          )
          for needle in required:
              assert needle in text, needle

          for forbidden in (
              "PlayerTick",
              "GameViewportClient:Tick",
              "OakPlayerController:InputKey",
              "Velocity =",
              "MaxWalkSpeed =",
              "MaxSprintSpeed =",
              "def _on_landed_pre",
          ):
              assert forbidden not in text, forbidden

          assert text.count("pawn.SetWantsToSprint(True)") == 1
          assert text.count("pawn.SetWantsToSlide(True)") == 1
          assert "_landing_transition_pending = False" in text
          assert "if mode != 1:" in text
          assert "_landing_crouch_pending = bool(slide_from_landing_option.value) and (" in text
          assert "_wants_crouch(obj) or _air_slide_intent" in text

          hooks = []
          for node in ast.walk(tree):
              if not isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                  continue
              for dec in node.decorator_list:
                  if isinstance(dec, ast.Call) and isinstance(dec.func, ast.Name) and dec.func.id == "hook":
                      if dec.args and isinstance(dec.args[0], ast.Constant):
                          hooks.append((dec.args[0].value, ast.unparse(dec.args[1]) if len(dec.args) > 1 else "Type.PRE"))

          assert ("/Game/PlayerCharacters/_Shared/_Design/Character/BPChar_Player.BPChar_Player_C:OnLanded", "Type.POST") in hooks
          assert ("/Script/Engine.Character:K2_OnMovementModeChanged", "Type.POST") in hooks
          assert ("/Script/Engine.CharacterMovementComponent:SetMovementMode", "Type.POST") in hooks

          meta = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          assert meta["project"]["version"] == meta["tool"]["sdkmod"]["version"] == "1.1.2"
          assert tuple(int(x) for x in meta["project"]["version"].split(".")) == (1,1,2)

          stage = Path("stage/SnappyMovement")
          stage.mkdir(parents=True, exist_ok=True)
          for name in ("__init__.py","pyproject.toml","README.md","README_RU.md","LICENSE","ADDITIONAL_TERMS.md"):
              (stage/name).write_bytes(Path(name).read_bytes())

          archive = Path("dist/SnappyMovement.sdkmod")
          archive.parent.mkdir(exist_ok=True)
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for path in sorted(stage.rglob("*")):
                  if path.is_file():
                      zf.write(path, path.relative_to(stage.parent).as_posix())

          with zipfile.ZipFile(archive) as zf:
              names=[n for n in zf.namelist() if n and not n.endswith("/")]
              assert archive.stem=="SnappyMovement"
              assert {n.split("/",1)[0] for n in names}=={"SnappyMovement"}
              assert len(names)==6
              assert "SnappyMovement/__init__.py" in names
              assert not any("__pycache__" in n or n.endswith((".pyc",".pyo")) for n in names)

          print("source_sha256", hashlib.sha256(source.read_bytes()).hexdigest())
          print("artifact_sha256", hashlib.sha256(archive.read_bytes()).hexdigest())
          print("MOVEMENT_FLOW_V112_GATES_PASS")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: SnappyMovement-movement-flow-v1.1.2
          path: dist/SnappyMovement.sdkmod
          if-no-files-found: error
