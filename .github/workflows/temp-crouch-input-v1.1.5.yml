name: Temporary SnappyMovement crouch-input diagnostic v1.1.5

on:
  push:
    branches:
      - diag-crouch-input-v1.1.5

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate crouch-input diagnostic and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import ast, hashlib, tomllib, zipfile

          source = Path("__init__.py")
          text = source.read_text(encoding="utf-8")
          tree = ast.parse(text, filename=str(source))
          compile(text, str(source), "exec")

          required = (
              'unrealsdk.find_all("PlayerAbility_Crouch_C", exact=False)',
              'unrealsdk.find_object("Function", path)',
              'add_hook(path, Type.POST, identifier, callback)',
              'remove_hook(path, Type.POST, identifier)',
              '[SnappyMovement crouchdiag] ability search',
              '[SnappyMovement crouchdiag] resolve',
              '[SnappyMovement crouchdiag] hook installed',
              '[SnappyMovement crouchdiag] event',
              'K2Node_GbxInputActionEvent_Discrete_5',
              'K2Node_GbxInputActionEvent_Discrete_6',
              'FlushCrouchInput',
              'get_pc(possibly_loading=True)',
              'hooks=HOOKS',
              'pawn.SetWantsToSprint(True)',
              'pawn.SetWantsToSlide(True)',
          )
          for needle in required:
              assert needle in text, needle

          # This diagnostic must not add generic polling/raw controller hooks.
          for forbidden in (
              "PlayerTick",
              "GameViewportClient:Tick",
              "OakPlayerController:InputKey",
              "Velocity =",
              "MaxWalkSpeed =",
              "MaxSprintSpeed =",
              "def _on_landed_pre",
          ):
              assert forbidden not in text, forbidden

          # Existing explicit feature hooks remain present.
          hook_names = {
              "_set_wants_to_sprint",
              "_on_start_sprinting",
              "_on_end_sprinting",
              "_on_jumped",
              "_on_landed_post",
              "_movement_mode_changed",
              "_movement_component_mode_changed",
              "_set_wants_to_slide",
              "_client_restart",
          }
          hooks_tuple = None
          for node in tree.body:
              if isinstance(node, ast.Assign) and any(isinstance(t, ast.Name) and t.id == "HOOKS" for t in node.targets):
                  hooks_tuple = node.value
                  break
          assert isinstance(hooks_tuple, ast.Tuple)
          actual = {elt.id for elt in hooks_tuple.elts if isinstance(elt, ast.Name)}
          assert actual == hook_names, actual

          meta = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          assert meta["project"]["version"] == meta["tool"]["sdkmod"]["version"] == "1.1.5"
          assert tuple(int(x) for x in meta["project"]["version"].split(".")) == (1,1,5)

          stage = Path("stage/SnappyMovement")
          stage.mkdir(parents=True, exist_ok=True)
          for name in ("__init__.py","pyproject.toml","README.md","README_RU.md","LICENSE","ADDITIONAL_TERMS.md"):
              (stage/name).write_bytes(Path(name).read_bytes())

          archive = Path("dist/SnappyMovement.sdkmod")
          archive.parent.mkdir(exist_ok=True)
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for path in sorted(stage.rglob("*")):
                  if path.is_file():
                      zf.write(path, path.relative_to(stage.parent).as_posix())

          with zipfile.ZipFile(archive) as zf:
              names=[n for n in zf.namelist() if n and not n.endswith("/")]
              assert archive.stem=="SnappyMovement"
              assert {n.split("/",1)[0] for n in names}=={"SnappyMovement"}
              assert len(names)==6
              assert "SnappyMovement/__init__.py" in names
              assert not any("__pycache__" in n or n.endswith((".pyc",".pyo")) for n in names)

          print("source_sha256", hashlib.sha256(source.read_bytes()).hexdigest())
          print("artifact_sha256", hashlib.sha256(archive.read_bytes()).hexdigest())
          print("CROUCH_INPUT_DIAG_V115_GATES_PASS")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: SnappyMovement-crouch-input-diag-v1.1.5
          path: dist/SnappyMovement.sdkmod
          if-no-files-found: error
