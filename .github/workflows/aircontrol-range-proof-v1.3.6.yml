name: Temporary SnappyMovement Air Control range proof v1.3.6

on:
  push:
    branches:
      - feature-aircontrol-range-proof-v1.3.6
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate Air Control range proof and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import ast, hashlib, tomllib, zipfile

          source = Path("__init__.py")
          text = source.read_text(encoding="utf-8")
          tree = ast.parse(text, filename=str(source))
          compile(text, "__init__.py", "exec")

          required = (
              "AIR_CONTROL_MIN = 0.6",
              '"air_control",\n    0.6,',
              "Air steering strength from the game's normal 0.6 up to 20.",
              "def _airproof_actor_xy(",
              "def _airproof_state(",
              "[SnappyMovement airproof]",
              "distance_xy={distance:.3f}",
              "start_speed_xy={_airproof_start_speed:.3f}",
              "end_speed_xy={end_speed!r}",
              '@hook("/Script/OakGame.OakCharacter:OnEndSprinting", Type.POST)',
              "_apply_auto_sprint_intent(obj)",
          )
          for needle in required:
              assert needle in text, needle

          for forbidden in (
              "autosprintfix",
              "_move_input_active",
              "_PLAYER_MOVE_HOOK",
              "InputAction_Continuous_Vector_Impl",
              "PlayerTick",
              "GameViewportClient:Tick",
              "OakPlayerController:InputKey",
              "Velocity =",
              "MaxWalkSpeed =",
              "MaxSprintSpeed =",
          ):
              assert forbidden not in text, forbidden

          # Proven production hook surface remains unchanged.
          assert text.count("@hook(") == 9
          assert text.count("add_hook(") == 3
          assert text.count("remove_hook(") == 3

          # A/B proof adds no new mutation surface.
          assert text.count("component.AirControl =") == 3
          assert text.count("component.MaxSprintAngle =") == 2
          assert text.count("pawn.SetWantsToSlide(True)") == 1
          assert text.count("pawn.SetWantsToSprint(True)") == 1
          assert text.count("pawn.SetWantsToSprint(False)") == 1
          assert text.count("pawn.SetWantsToSprint(wanted)") == 1

          # All Air Control validation paths use vanilla floor/default 0.6.
          assert text.count("AIR_CONTROL_MIN = 0.6") == 1
          assert text.count(
              "air_control_option.value,\n                0.6,\n                AIR_CONTROL_MIN"
          ) == 1
          assert text.count(
              "air_control_option.value,\n        0.6,\n        AIR_CONTROL_MIN"
          ) == 1
          assert text.count(
              "air_control_option.value,\n            0.6,\n            AIR_CONTROL_MIN"
          ) == 1

          # Proof helpers are observational: only read actor location, AirControl and Velocity.
          proof_start = text.index("def _airproof_actor_xy(")
          proof_end = text.index("def _bound_function_path", proof_start)
          proof = text[proof_start:proof_end]
          assert "K2_GetActorLocation()" in proof
          assert "movement.AirControl" in proof
          assert "movement.Velocity" in proof
          # no assignment to movement/component in proof helper block
          assert "movement.AirControl =" not in proof
          assert "movement.Velocity =" not in proof

          meta = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          assert meta["project"]["version"] == "1.3.6"
          assert meta["tool"]["sdkmod"]["version"] == "1.3.6"

          stage = Path("stage/SnappyMovement")
          stage.mkdir(parents=True, exist_ok=True)
          for name in ("__init__.py","pyproject.toml","README.md","README_RU.md","LICENSE","ADDITIONAL_TERMS.md"):
              (stage/name).write_bytes(Path(name).read_bytes())

          archive = Path("dist/SnappyMovement.sdkmod")
          archive.parent.mkdir(exist_ok=True)
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for path in sorted(stage.rglob("*")):
                  if path.is_file():
                      zf.write(path, path.relative_to(stage.parent).as_posix())

          print("source_sha256", hashlib.sha256(source.read_bytes()).hexdigest())
          print("artifact_sha256", hashlib.sha256(archive.read_bytes()).hexdigest())
          print("AIRCONTROL_RANGE_PROOF_V136_GATES_PASS")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: SnappyMovement-aircontrol-range-proof-v1.3.6
          path: dist/SnappyMovement.sdkmod
          if-no-files-found: error
