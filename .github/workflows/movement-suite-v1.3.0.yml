name: Temporary SnappyMovement movement suite v1.3.0

on:
  push:
    branches:
      - feature-movement-suite-v1.3.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate movement suite and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import ast, hashlib, tomllib, zipfile

          source = Path("__init__.py")
          text = source.read_text(encoding="utf-8")
          tree = ast.parse(text, filename=str(source))
          compile(text, str(source), "exec")

          required = (
              'identifier="air_control_override"',
              '"air_control"',
              'identifier="auto_sprint"',
              '"walk_override"',
              'identifier="any_direction_sprint"',
              'ANY_DIRECTION_SPRINT_ANGLE = 180.0',
              'component.AirControl = target_air_control',
              'component.MaxSprintAngle = target_sprint_angle',
              'component.AirControl = old_air_control',
              'component.MaxSprintAngle = old_sprint_angle',
              'def _find_action_bindings(',
              'DynamicBindingObjects',
              'InputActionReceiverDelegateBindings',
              'PlayerAbility_Sprint_C',
              'add_hook(path, Type.PRE, pre_id, _sprint_input_pre)',
              'add_hook(path, Type.POST, post_id, _sprint_input_post)',
              'def _sprint_input_pre(',
              'def _sprint_input_post(',
              'pawn.SetWantsToSprint(wanted)',
              'movement.bWantsToStartSprinting = True',
              'WALK_OVERRIDE_HOLD',
              'WALK_OVERRIDE_TOGGLE',
              '_CROUCH_INPUT_FN_4',
              '_CROUCH_INPUT_FN_5',
              '_CROUCH_FLUSH_FN',
              'def _should_slide_from_landing(',
              'pawn.SetWantsToSlide(True)',
              'get_pc(possibly_loading=True)',
              'hooks=HOOKS',
          )
          for needle in required:
              assert needle in text, needle

          for forbidden in (
              'actiondiag', 'bindingdiag', 'crouchdiag', 'hookcheck',
              '[SnappyMovement raw]', '[SnappyMovement test]',
              'WillowGame.WillowPlayerController:PlayerTick',
              'OakGame.OakPlayerController:PlayerTick',
              'GameViewportClient:Tick',
              'OakPlayerController:InputKey',
              'Velocity =',
              'MaxWalkSpeed =',
              'MaxSprintSpeed =',
              'GbxInpActEvt_InputAction_Discrete_Sprint_K2Node_GbxInputActionEvent_Discrete_3',
              'GbxInpActEvt_InputAction_Discrete_Sprint_K2Node_GbxInputActionEvent_Discrete_4',
          ):
              assert forbidden not in text, forbidden

          assert text.count("@hook(") == 9
          assert text.count("add_hook(") == 3
          assert text.count("remove_hook(") == 3
          assert text.count("component.MaxAcceleration =") == 2
          assert text.count("component.BrakingDecelerationWalking =") == 2
          assert text.count("component.AirControl =") == 2
          assert text.count("component.MaxSprintAngle =") == 2
          assert text.count("pawn.SetWantsToSlide(True)") == 1
          assert text.count("pawn.SetWantsToSprint(True)") == 1
          assert text.count("pawn.SetWantsToSprint(wanted)") == 1
          assert text.count("pawn.SetWantsToSprint(False)") == 1
          assert text.count("movement.bWantsToStartSprinting = True") == 1

          assert 'current_action_name.lower() != action_name.lower()' in text
          assert 'event = _input_event_name(entry.InputEvent)' in text
          assert 'return "pressed"' in text
          assert 'return "released"' in text

          pre_start = text.index("def _sprint_input_pre(")
          pre_end = text.index("def _sprint_input_post(", pre_start)
          pre = text[pre_start:pre_end]
          assert '_walk_override_active = True' in pre
          assert '_walk_override_active = not _walk_override_active' in pre
          assert 'event == "released"' in pre

          # Auto Sprint and Remember Sprint must not leak state into each other.
          start_start = text.index("def _on_start_sprinting(")
          start_end = text.index("def _on_end_sprinting(", start_start)
          start_block = text[start_start:start_end]
          assert 'not bool(auto_sprint_option.value)' in start_block

          end_start = start_end
          end_end = text.index("@hook(", end_start)
          end_block = text[end_start:end_end]
          assert 'or bool(auto_sprint_option.value)' in end_block

          auto_change_start = text.index("def _on_auto_sprint_change(")
          auto_change_end = text.index("def _on_walk_override_change(", auto_change_start)
          auto_change = text[auto_change_start:auto_change_end]
          assert '_sprint_chain_armed = False' in auto_change
          assert '_resume_sprint_after_landing = False' in auto_change

          hooks_tuple = None
          for node in tree.body:
              if isinstance(node, ast.Assign) and any(
                  isinstance(t, ast.Name) and t.id == "HOOKS" for t in node.targets
              ):
                  hooks_tuple = node.value
                  break
          assert isinstance(hooks_tuple, ast.Tuple)
          names = [elt.id for elt in hooks_tuple.elts if isinstance(elt, ast.Name)]
          assert names == [
              "_set_wants_to_sprint",
              "_on_start_sprinting",
              "_on_end_sprinting",
              "_on_jumped",
              "_on_landed_post",
              "_movement_mode_changed",
              "_movement_component_mode_changed",
              "_set_wants_to_slide",
              "_client_restart",
          ], names

          meta = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          version = meta["project"]["version"]
          assert version == meta["tool"]["sdkmod"]["version"] == "1.3.0"

          stage = Path("stage/SnappyMovement")
          stage.mkdir(parents=True, exist_ok=True)
          for name in ("__init__.py","pyproject.toml","README.md","README_RU.md","LICENSE","ADDITIONAL_TERMS.md"):
              (stage/name).write_bytes(Path(name).read_bytes())

          archive = Path("dist/SnappyMovement.sdkmod")
          archive.parent.mkdir(exist_ok=True)
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for path in sorted(stage.rglob("*")):
                  if path.is_file():
                      zf.write(path, path.relative_to(stage.parent).as_posix())

          with zipfile.ZipFile(archive) as zf:
              names = [n for n in zf.namelist() if n and not n.endswith("/")]
              assert {n.split("/", 1)[0] for n in names} == {"SnappyMovement"}
              assert len(names) == 6
              assert "SnappyMovement/__init__.py" in names
              assert not any("__pycache__" in n or n.endswith((".pyc",".pyo")) for n in names)

          print("source_sha256", hashlib.sha256(source.read_bytes()).hexdigest())
          print("artifact_sha256", hashlib.sha256(archive.read_bytes()).hexdigest())
          print("MOVEMENT_SUITE_V130_GATES_PASS")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: SnappyMovement-movement-suite-v1.3.0
          path: dist/SnappyMovement.sdkmod
          if-no-files-found: error
