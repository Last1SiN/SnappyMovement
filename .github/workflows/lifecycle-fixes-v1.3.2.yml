name: Temporary SnappyMovement lifecycle fixes v1.3.2

on:
  push:
    branches:
      - fix-aircontrol-autosprint-v1.3.2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate lifecycle fixes and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import ast, hashlib, tomllib, zipfile

          source = Path("__init__.py")
          text = source.read_text(encoding="utf-8")
          tree = ast.parse(text, filename=str(source))
          compile(text, str(source), "exec")

          required = (
              '_PLAYER_MOVE_HOOK = "/Script/OakGame.OakInputAbility_Player_Common:PlayerMove"',
              '@hook(_PLAYER_MOVE_HOOK, Type.POST)',
              'def _player_move(',
              'value = args.Val',
              'magnitude_sq = float(value.X) ** 2 + float(value.Y) ** 2',
              'active = magnitude_sq > 0.0001',
              'if _move_input_active:',
              '_move_input_active = True',
              'if not _walk_override_active:',
              '_apply_auto_sprint_intent(pawn)',
              'def _apply_air_control_override(',
              'component.AirControl = target',
              '[SnappyMovement moveprobe]',
              '[SnappyMovement airfix]',
              'if new_mode == 3:',
              '_apply_air_control_override(obj)',
              '_apply_air_control_override(pawn)',
              'hooks=HOOKS',
          )
          for needle in required:
              assert needle in text, needle

          for forbidden in (
              "PlayerTick",
              "GameViewportClient:Tick",
              "OakPlayerController:InputKey",
              "Velocity =",
              "MaxWalkSpeed =",
              "MaxSprintSpeed =",
              "actiondiag",
              "bindingdiag",
              "crouchdiag",
              "hookcheck",
              "airprobe",
          ):
              assert forbidden not in text, forbidden

          # Only one new explicit hook versus clean v1.3.0: native PlayerMove.
          assert text.count("@hook(") == 10
          assert text.count("add_hook(") == 3
          assert text.count("remove_hook(") == 3

          # Existing native mutation surface remains narrow.
          assert text.count("pawn.SetWantsToSlide(True)") == 1
          assert text.count("pawn.SetWantsToSprint(True)") == 1
          assert text.count("pawn.SetWantsToSprint(False)") == 1
          assert text.count("pawn.SetWantsToSprint(wanted)") == 1

          # AirControl gets its normal apply, restore, and one lifecycle reapply helper write.
          assert text.count("component.AirControl =") == 3
          assert text.count("component.MaxSprintAngle =") == 2

          # AirControl is reapplied for walking-off-edge/falling and normal jumps.
          jumped_start = text.index("def _on_jumped(")
          jumped_end = text.index("@hook(", jumped_start)
          jumped = text[jumped_start:jumped_end]
          assert "_apply_air_control_override(obj)" in jumped

          mode_start = text.index("def _movement_mode_changed(")
          mode_end = text.index("@hook(", mode_start)
          mode = text[mode_start:mode_end]
          assert "if new_mode == 3:" in mode
          assert "_apply_air_control_override(obj)" in mode

          comp_start = text.index("def _movement_component_mode_changed(")
          comp_end = text.index("@hook(", comp_start)
          comp = text[comp_start:comp_end]
          assert "if new_mode == 3:" in comp
          assert "_apply_air_control_override(pawn)" in comp

          # PlayerMove does rising-edge rearm, not per-frame SetWantsToSprint.
          move_start = text.index("def _player_move(")
          move_end = text.index("def _remove_sprint_dynamic_hooks", move_start)
          move = text[move_start:move_end]
          assert 'if not active:' in move
          assert '_move_input_active = False' in move
          assert 'if _move_input_active:' in move
          assert '_move_input_active = True' in move
          assert move.count("_apply_auto_sprint_intent(pawn)") == 1

          hooks_tuple = None
          for node in tree.body:
              if isinstance(node, ast.Assign) and any(
                  isinstance(t, ast.Name) and t.id == "HOOKS" for t in node.targets
              ):
                  hooks_tuple = node.value
                  break
          assert isinstance(hooks_tuple, ast.Tuple)
          names = [elt.id for elt in hooks_tuple.elts if isinstance(elt, ast.Name)]
          assert names == [
              "_player_move",
              "_set_wants_to_sprint",
              "_on_start_sprinting",
              "_on_end_sprinting",
              "_on_jumped",
              "_on_landed_post",
              "_movement_mode_changed",
              "_movement_component_mode_changed",
              "_set_wants_to_slide",
              "_client_restart",
          ], names

          meta = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          version = meta["project"]["version"]
          assert version == meta["tool"]["sdkmod"]["version"] == "1.3.2"

          stage = Path("stage/SnappyMovement")
          stage.mkdir(parents=True, exist_ok=True)
          for name in ("__init__.py","pyproject.toml","README.md","README_RU.md","LICENSE","ADDITIONAL_TERMS.md"):
              (stage/name).write_bytes(Path(name).read_bytes())

          archive = Path("dist/SnappyMovement.sdkmod")
          archive.parent.mkdir(exist_ok=True)
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for path in sorted(stage.rglob("*")):
                  if path.is_file():
                      zf.write(path, path.relative_to(stage.parent).as_posix())

          with zipfile.ZipFile(archive) as zf:
              names = [n for n in zf.namelist() if n and not n.endswith("/")]
              assert {n.split("/", 1)[0] for n in names} == {"SnappyMovement"}
              assert len(names) == 6
              assert "SnappyMovement/__init__.py" in names

          print("source_sha256", hashlib.sha256(source.read_bytes()).hexdigest())
          print("artifact_sha256", hashlib.sha256(archive.read_bytes()).hexdigest())
          print("LIFECYCLE_FIXES_V132_GATES_PASS")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: SnappyMovement-lifecycle-fixes-v1.3.2
          path: dist/SnappyMovement.sdkmod
          if-no-files-found: error
