name: Temporary SnappyMovement movement-flow candidate v1.1.0

on:
  push:
    branches:
      - feature-movement-flow-v1.1.0

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate movement-flow candidate and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import ast, hashlib, tomllib, zipfile

          source = Path("__init__.py")
          text = source.read_text(encoding="utf-8")
          tree = ast.parse(text, filename=str(source))
          compile(text, str(source), "exec")

          # Existing v1.0 movement patch/restore contract remains present.
          for needle in (
              "component.MaxAcceleration = acceleration",
              "component.BrakingDecelerationWalking = braking",
              "component.MaxAcceleration = old_accel",
              "component.BrakingDecelerationWalking = old_brake",
              '@hook("/Script/Engine.PlayerController:ClientRestart", Type.POST)',
          ):
              assert needle in text, needle

          # Both new features are optional and default off.
          assert 'identifier="remember_sprint"' in text
          assert 'identifier="slide_from_landing"' in text
          assert text.count("value=False") >= 2
          assert 'display_name="Remember Sprint"' in text
          assert 'display_name="Slide from Landing"' in text

          # No generic frame/input hook or speed rewrite.
          for forbidden in (
              "PlayerTick",
              "GameViewportClient:Tick",
              "OakPlayerController:InputKey",
              "MaxSprintSpeed =",
              "MaxWalkSpeed =",
              "Velocity =",
          ):
              assert forbidden not in text, forbidden

          # Only already-resolved v1.0.6 targets are used.
          allowed = {
              "/Script/Engine.PlayerController:ClientRestart",
              "/Script/OakGame.OakCharacter:SetWantsToSprint",
              "/Script/OakGame.OakCharacter:OnStartSprinting",
              "/Script/OakGame.OakCharacter:OnEndSprinting",
              "/Script/OakGame.OakCharacter:SetWantsToSlide",
              "/Game/PlayerCharacters/_Shared/_Design/Character/BPChar_Player.BPChar_Player_C:OnJumped",
              "/Game/PlayerCharacters/_Shared/_Design/Character/BPChar_Player.BPChar_Player_C:OnLanded",
          }
          hooks = []
          for node in ast.walk(tree):
              if not isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                  continue
              for dec in node.decorator_list:
                  if not isinstance(dec, ast.Call):
                      continue
                  if isinstance(dec.func, ast.Name) and dec.func.id == "hook":
                      if dec.args and isinstance(dec.args[0], ast.Constant):
                          hooks.append(dec.args[0].value)
          assert set(hooks) == allowed, hooks
          assert hooks.count("/Game/PlayerCharacters/_Shared/_Design/Character/BPChar_Player.BPChar_Player_C:OnLanded") == 2

          # Native requests are narrowly scoped.
          assert text.count("pawn.SetWantsToSprint(True)") == 1
          assert text.count("obj.SetWantsToSlide(True)") == 1
          assert "_restoring_sprint" in text
          assert "_landing_crouch_pending = _wants_crouch(obj)" in text
          assert "if not slide_requested:" in text
          assert '_restore_remembered_sprint(obj, "landing")' in text

          # UObject identity must be native-address based, not Python wrapper identity.
          assert "left._get_address()" in text
          assert "right._get_address()" in text
          assert "not _same_uobject(obj, _get_current_pawn())" in text

          meta = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          assert meta["project"]["version"] == meta["tool"]["sdkmod"]["version"] == "1.1.0"
          assert tuple(int(x) for x in meta["project"]["version"].split(".")) == (1, 1, 0)

          stage = Path("stage/SnappyMovement")
          stage.mkdir(parents=True, exist_ok=True)
          package_files = (
              "__init__.py",
              "pyproject.toml",
              "README.md",
              "README_RU.md",
              "LICENSE",
              "ADDITIONAL_TERMS.md",
          )
          for name in package_files:
              (stage / name).write_bytes(Path(name).read_bytes())

          archive = Path("dist/SnappyMovement.sdkmod")
          archive.parent.mkdir(exist_ok=True)
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for path in sorted(stage.rglob("*")):
                  if path.is_file():
                      zf.write(path, path.relative_to(stage.parent).as_posix())

          with zipfile.ZipFile(archive) as zf:
              names = [n for n in zf.namelist() if n and not n.endswith("/")]
              assert archive.stem == "SnappyMovement"
              assert {n.split("/", 1)[0] for n in names} == {"SnappyMovement"}
              assert len(names) == 6
              assert "SnappyMovement/__init__.py" in names
              assert not any("__pycache__" in n or n.endswith((".pyc", ".pyo")) for n in names)

          print("source_sha256", hashlib.sha256(source.read_bytes()).hexdigest())
          print("artifact_sha256", hashlib.sha256(archive.read_bytes()).hexdigest())
          print("MOVEMENT_FLOW_CANDIDATE_GATES_PASS")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: SnappyMovement-movement-flow-v1.1.0
          path: dist/SnappyMovement.sdkmod
          if-no-files-found: error
