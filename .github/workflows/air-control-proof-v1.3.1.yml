name: Temporary SnappyMovement Air Control proof v1.3.1

on:
  push:
    branches:
      - diag-air-control-effect-v1.3.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate Air Control proof and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import ast, hashlib, tomllib, zipfile

          source = Path("__init__.py")
          text = source.read_text(encoding="utf-8")
          ast.parse(text)
          compile(text, "__init__.py", "exec")

          for needle in (
              "[SnappyMovement airprobe]",
              "def _air_control_readback(",
              "def _actor_xy(",
              "def _log_air_control_state(",
              '_log_air_control_state(obj, "jump")',
              '_log_air_control_state(obj, "falling")',
              "distance_xy={distance:.3f}",
              '_log_air_control_state(_get_current_pawn(), "option-change")',
              "component.AirControl = target_air_control",
              "component.AirControl = old_air_control",
          ):
              assert needle in text, needle

          for forbidden in (
              "PlayerTick", "GameViewportClient:Tick", "OakPlayerController:InputKey",
              "Velocity =", "MaxWalkSpeed =", "MaxSprintSpeed =",
              "actiondiag", "bindingdiag", "crouchdiag", "hookcheck",
          ):
              assert forbidden not in text, forbidden

          # Proof build adds no hook or behavior-mutation surface.
          assert text.count("@hook(") == 9
          assert text.count("add_hook(") == 3
          assert text.count("remove_hook(") == 3
          assert text.count("component.AirControl =") == 2
          assert text.count("component.MaxSprintAngle =") == 2
          assert text.count("pawn.SetWantsToSlide(True)") == 1
          assert text.count("pawn.SetWantsToSprint(True)") == 1
          assert text.count("pawn.SetWantsToSprint(wanted)") == 1
          assert text.count("pawn.SetWantsToSprint(False)") == 1

          meta = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          assert meta["project"]["version"] == "1.3.1"
          assert meta["tool"]["sdkmod"]["version"] == "1.3.1"

          stage = Path("stage/SnappyMovement")
          stage.mkdir(parents=True, exist_ok=True)
          for name in ("__init__.py","pyproject.toml","README.md","README_RU.md","LICENSE","ADDITIONAL_TERMS.md"):
              (stage/name).write_bytes(Path(name).read_bytes())

          archive = Path("dist/SnappyMovement.sdkmod")
          archive.parent.mkdir(exist_ok=True)
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for path in sorted(stage.rglob("*")):
                  if path.is_file():
                      zf.write(path, path.relative_to(stage.parent).as_posix())

          print("source_sha256", hashlib.sha256(source.read_bytes()).hexdigest())
          print("artifact_sha256", hashlib.sha256(archive.read_bytes()).hexdigest())
          print("AIR_CONTROL_PROOF_V131_GATES_PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: SnappyMovement-air-control-proof-v1.3.1
          path: dist/SnappyMovement.sdkmod
          if-no-files-found: error
