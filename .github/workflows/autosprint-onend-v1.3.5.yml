name: Temporary SnappyMovement Auto Sprint OnEnd v1.3.5

on:
  push:
    branches:
      - fix-autosprint-onend-v1.3.5
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate Auto Sprint OnEnd lifecycle and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import ast, hashlib, tomllib, zipfile

          source = Path("__init__.py")
          text = source.read_text(encoding="utf-8")
          tree = ast.parse(text, filename=str(source))
          compile(text, "__init__.py", "exec")

          required = (
              '@hook("/Script/OakGame.OakCharacter:OnEndSprinting", Type.POST)',
              'def _on_end_sprinting(',
              'if bool(auto_sprint_option.value):',
              'if not _walk_override_active:',
              'restored = _apply_auto_sprint_intent(obj)',
              '[SnappyMovement autosprintfix]',
              're-armed native sprint intent after OnEndSprinting',
              'def _apply_air_control_override(',
              'component.MaxSprintAngle = target_sprint_angle',
              'pawn.SetWantsToSprint(wanted)',
              'movement.bWantsToStartSprinting = True',
          )
          for needle in required:
              assert needle in text, needle

          for forbidden in (
              '_PLAYER_MOVE_HOOK',
              'def _player_move(',
              'InputAction_Continuous_Vector_Impl',
              'def _continuous_move_input(',
              'PlayerTick',
              'GameViewportClient:Tick',
              'OakPlayerController:InputKey',
              'Velocity =',
              'MaxWalkSpeed =',
              'MaxSprintSpeed =',
              'moveprobe',
              'movediag',
              'airprobe',
          ):
              assert forbidden not in text, forbidden

          # Back to the proven explicit-hook surface; no movement-input hook remains.
          assert text.count("@hook(") == 9
          assert text.count("add_hook(") == 3
          assert text.count("remove_hook(") == 3

          # Existing mutation surface remains narrow.
          assert text.count("pawn.SetWantsToSlide(True)") == 1
          assert text.count("pawn.SetWantsToSprint(True)") == 1
          assert text.count("pawn.SetWantsToSprint(False)") == 1
          assert text.count("pawn.SetWantsToSprint(wanted)") == 1
          assert text.count("component.AirControl =") == 3
          assert text.count("component.MaxSprintAngle =") == 2

          # Auto Sprint re-arms only through the already-proven OnEndSprinting lifecycle.
          start = text.index("def _on_end_sprinting(")
          end = text.index("@hook(", start)
          block = text[start:end]
          assert 'if bool(auto_sprint_option.value):' in block
          assert 'if not _walk_override_active:' in block
          assert block.count("_apply_auto_sprint_intent(obj)") == 1
          assert 'return' in block

          hooks_tuple = None
          for node in tree.body:
              if isinstance(node, ast.Assign) and any(
                  isinstance(t, ast.Name) and t.id == "HOOKS" for t in node.targets
              ):
                  hooks_tuple = node.value
                  break
          assert isinstance(hooks_tuple, ast.Tuple)
          names = [elt.id for elt in hooks_tuple.elts if isinstance(elt, ast.Name)]
          assert names == [
              "_set_wants_to_sprint",
              "_on_start_sprinting",
              "_on_end_sprinting",
              "_on_jumped",
              "_on_landed_post",
              "_movement_mode_changed",
              "_movement_component_mode_changed",
              "_set_wants_to_slide",
              "_client_restart",
          ], names

          meta = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          assert meta["project"]["version"] == "1.3.5"
          assert meta["tool"]["sdkmod"]["version"] == "1.3.5"

          stage = Path("stage/SnappyMovement")
          stage.mkdir(parents=True, exist_ok=True)
          for name in ("__init__.py","pyproject.toml","README.md","README_RU.md","LICENSE","ADDITIONAL_TERMS.md"):
              (stage/name).write_bytes(Path(name).read_bytes())

          archive = Path("dist/SnappyMovement.sdkmod")
          archive.parent.mkdir(exist_ok=True)
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for path in sorted(stage.rglob("*")):
                  if path.is_file():
                      zf.write(path, path.relative_to(stage.parent).as_posix())

          print("source_sha256", hashlib.sha256(source.read_bytes()).hexdigest())
          print("artifact_sha256", hashlib.sha256(archive.read_bytes()).hexdigest())
          print("AUTOSPRINT_ONEND_V135_GATES_PASS")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: SnappyMovement-autosprint-onend-v1.3.5
          path: dist/SnappyMovement.sdkmod
          if-no-files-found: error
