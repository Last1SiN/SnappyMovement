name: Temporary SnappyMovement native-event diagnostic v1.0.5

on:
  push:
    branches:
      - diag-sprint-slide-events-v1.0.5

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate targeted native-event diagnostic and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import ast, hashlib, tomllib, zipfile

          source = Path("__init__.py")
          text = source.read_text(encoding="utf-8")
          tree = ast.parse(text, filename=str(source))
          compile(text, str(source), "exec")

          # Proven SnappyMovement lifecycle instrumentation retained.
          for needle in (
              'ENABLE_BEFORE',
              'ENABLE_AFTER',
              'DISABLE_BEFORE',
              'DISABLE_AFTER',
              'RESTORE_BEGIN',
              'RESTORE_AFTER',
              'RESTORE_END',
              'CLIENT_RESTART_BEFORE',
              'CLIENT_RESTART_AFTER',
              'existing is component',
              '@hook("/Script/Engine.PlayerController:ClientRestart", Type.POST)',
          ):
              assert needle in text, needle

          # No generic runtime polling/input interception.
          for forbidden in (
              "PlayerTick",
              "GameViewportClient:Tick",
              "OakPlayerController:InputKey",
              "keybind(",
          ):
              assert forbidden not in text, forbidden

          # Probe is observational only.
          for forbidden in (
              "SetWantsToSprint(True)",
              "SetWantsToSprint(False)",
              "SetWantsToSlide(True)",
              "SetWantsToSlide(False)",
              "bWantsToSprint =",
              "bWantsToStartSprinting =",
              "bWantsToSlide =",
              "bIsSprinting =",
              "ServerStartSliding()",
              "ServerStopSliding()",
          ):
              assert forbidden not in text, forbidden

          expected_hooks = {
              "/Script/Engine.PlayerController:ClientRestart",
              "OakGame.OakCharacter:SetWantsToSprint",
              "OakGame.OakCharacter:StopWantingToStartSprinting",
              "OakGame.OakCharacter:OnStartSprinting",
              "OakGame.OakCharacter:OnEndSprinting",
              "OakGame.OakCharacter:SetWantsToSlide",
              "BPChar_Player.BPChar_Player_C:OnJumped",
              "BPChar_Player.BPChar_Player_C:OnLanded",
              "OakGame.OakCharacterMovementComponent:ServerStartSliding",
              "OakGame.OakCharacterMovementComponent:ServerStopSliding",
          }
          hook_paths = []
          for node in ast.walk(tree):
              if not isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                  continue
              for dec in node.decorator_list:
                  if not isinstance(dec, ast.Call):
                      continue
                  if isinstance(dec.func, ast.Name) and dec.func.id == "hook":
                      if dec.args and isinstance(dec.args[0], ast.Constant):
                          hook_paths.append(dec.args[0].value)
          assert set(hook_paths) == expected_hooks, hook_paths
          assert len(hook_paths) == len(expected_hooks), hook_paths

          for marker in (
              "SET_WANTS_TO_SPRINT",
              "STOP_WANTING_TO_START_SPRINTING",
              "ON_START_SPRINTING",
              "ON_END_SPRINTING",
              "SET_WANTS_TO_SLIDE",
              "ON_JUMPED",
              "ON_LANDED",
              "SERVER_START_SLIDING",
              "SERVER_STOP_SLIDING",
          ):
              assert marker in text, marker

          for state in (
              "bWantsToSprint",
              "bWantsToStartSprinting",
              "bIsSprinting",
              "bWantsToSlide",
              "bPendingSlideJump",
              "MovementMode",
              "CurrentJumpType",
              "GetWantsToSprint",
              "GetWantsToCrouch",
              "IsSprinting",
              "IsCharacterSliding",
          ):
              assert state in text, state

          meta = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          assert meta["project"]["version"] == meta["tool"]["sdkmod"]["version"] == "1.0.5"
          assert tuple(int(x) for x in meta["project"]["version"].split(".")) == (1, 0, 5)

          stage = Path("stage/SnappyMovement")
          stage.mkdir(parents=True, exist_ok=True)
          for name in (
              "__init__.py",
              "pyproject.toml",
              "README.md",
              "README_RU.md",
              "LICENSE",
              "ADDITIONAL_TERMS.md",
          ):
              (stage / name).write_bytes(Path(name).read_bytes())

          archive = Path("dist/SnappyMovement.sdkmod")
          archive.parent.mkdir(exist_ok=True)
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for path in sorted(stage.rglob("*")):
                  if path.is_file():
                      zf.write(path, path.relative_to(stage.parent).as_posix())

          with zipfile.ZipFile(archive) as zf:
              names = [n for n in zf.namelist() if n and not n.endswith("/")]
              assert archive.stem == "SnappyMovement"
              assert {n.split("/", 1)[0] for n in names} == {"SnappyMovement"}
              assert len(names) == 6
              assert "SnappyMovement/__init__.py" in names
              assert not any("__pycache__" in n or n.endswith((".pyc", ".pyo")) for n in names)

          print("source_sha256", hashlib.sha256(source.read_bytes()).hexdigest())
          print("artifact_sha256", hashlib.sha256(archive.read_bytes()).hexdigest())
          print("TARGETED_NATIVE_EVENT_GATES_PASS")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: SnappyMovement-native-event-diagnostic-v1.0.5
          path: dist/SnappyMovement.sdkmod
          if-no-files-found: error
