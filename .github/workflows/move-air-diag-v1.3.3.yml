name: Temporary SnappyMovement move + air diagnostic v1.3.3

on:
  push:
    branches:
      - diag-move-aircontrol-v1.3.3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate move + air diagnostic and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import ast, hashlib, tomllib, zipfile

          source = Path("__init__.py")
          text = source.read_text(encoding="utf-8")
          tree = ast.parse(text, filename=str(source))
          compile(text, "__init__.py", "exec")

          required = (
              '_GBX_CONTINUOUS_VECTOR_HOOK = "/Script/GbxInput.GbxInputComponent:InputAction_Continuous_Vector_Impl"',
              'def _discover_move_binding() -> str | None:',
              'DynamicBindingObjects',
              'InputActionReceiverDelegateBindings',
              'selected_move_action=',
              '@hook(_GBX_CONTINUOUS_VECTOR_HOOK, Type.POST)',
              'args.AxisAction',
              'args.Value',
              'active != _move_axis_probe_active',
              '[SnappyMovement movediag]',
              '[SnappyMovement airdiag]',
              'distance_xy={distance:.3f}',
              '_gbx_continuous_vector_probe,',
              '_player_move,',
          )
          for needle in required:
              assert needle in text, needle

          for forbidden in (
              "PlayerTick",
              "GameViewportClient:Tick",
              "OakPlayerController:InputKey",
              "Velocity =",
              "MaxWalkSpeed =",
              "MaxSprintSpeed =",
              "actiondiag",
              "bindingdiag",
              "crouchdiag",
              "hookcheck",
              "airprobe",
          ):
              assert forbidden not in text, forbidden

          # v1.3.2 had 10 explicit hooks; this diagnostic adds exactly one upstream observer.
          assert text.count("@hook(") == 11
          assert text.count("add_hook(") == 3
          assert text.count("remove_hook(") == 3

          # Diagnostic must not broaden mutation surface.
          assert text.count("component.AirControl =") == 3
          assert text.count("component.MaxSprintAngle =") == 2
          assert text.count("pawn.SetWantsToSlide(True)") == 1
          assert text.count("pawn.SetWantsToSprint(True)") == 1
          assert text.count("pawn.SetWantsToSprint(False)") == 1
          assert text.count("pawn.SetWantsToSprint(wanted)") == 1

          hooks_tuple = None
          for node in tree.body:
              if isinstance(node, ast.Assign) and any(
                  isinstance(t, ast.Name) and t.id == "HOOKS" for t in node.targets
              ):
                  hooks_tuple = node.value
                  break
          assert isinstance(hooks_tuple, ast.Tuple)
          names = [elt.id for elt in hooks_tuple.elts if isinstance(elt, ast.Name)]
          assert names == [
              "_gbx_continuous_vector_probe",
              "_player_move",
              "_set_wants_to_sprint",
              "_on_start_sprinting",
              "_on_end_sprinting",
              "_on_jumped",
              "_on_landed_post",
              "_movement_mode_changed",
              "_movement_component_mode_changed",
              "_set_wants_to_slide",
              "_client_restart",
          ], names

          meta = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          assert meta["project"]["version"] == "1.3.3"
          assert meta["tool"]["sdkmod"]["version"] == "1.3.3"

          stage = Path("stage/SnappyMovement")
          stage.mkdir(parents=True, exist_ok=True)
          for name in ("__init__.py","pyproject.toml","README.md","README_RU.md","LICENSE","ADDITIONAL_TERMS.md"):
              (stage/name).write_bytes(Path(name).read_bytes())

          archive = Path("dist/SnappyMovement.sdkmod")
          archive.parent.mkdir(exist_ok=True)
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for path in sorted(stage.rglob("*")):
                  if path.is_file():
                      zf.write(path, path.relative_to(stage.parent).as_posix())

          print("source_sha256", hashlib.sha256(source.read_bytes()).hexdigest())
          print("artifact_sha256", hashlib.sha256(archive.read_bytes()).hexdigest())
          print("MOVE_AIR_DIAG_V133_GATES_PASS")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: SnappyMovement-move-air-diag-v1.3.3
          path: dist/SnappyMovement.sdkmod
          if-no-files-found: error
