name: Temporary SnappyMovement Auto Sprint continuous move v1.3.4

on:
  push:
    branches:
      - fix-autosprint-continuous-move-v1.3.4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate Auto Sprint continuous move and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import ast, hashlib, tomllib, zipfile

          source = Path("__init__.py")
          text = source.read_text(encoding="utf-8")
          tree = ast.parse(text, filename=str(source))
          compile(text, "__init__.py", "exec")

          required = (
              '_GBX_CONTINUOUS_VECTOR_HOOK = "/Script/GbxInput.GbxInputComponent:InputAction_Continuous_Vector_Impl"',
              'def _discover_move_action_name() -> str | None:',
              'if ability is None and abilities:',
              'ability = abilities[0]',
              '@hook(_GBX_CONTINUOUS_VECTOR_HOOK, Type.POST)',
              'def _continuous_move_input(',
              'action_name = str(action.ActionName)',
              'value = args.Value',
              'if _move_action_name is None:',
              'if not active:',
              '_move_input_active = False',
              'if _move_input_active:',
              '_move_input_active = True',
              'if not _walk_override_active:',
              '_apply_auto_sprint_intent(pawn)',
              '[SnappyMovement moveprobe]',
              '_continuous_move_input,',
          )
          for needle in required:
              assert needle in text, needle

          for forbidden in (
              '_PLAYER_MOVE_HOOK',
              'def _player_move(',
              "PlayerTick",
              "GameViewportClient:Tick",
              "OakPlayerController:InputKey",
              "Velocity =",
              "MaxWalkSpeed =",
              "MaxSprintSpeed =",
              "actiondiag",
              "bindingdiag",
              "crouchdiag",
              "hookcheck",
              "airprobe",
          ):
              assert forbidden not in text, forbidden

          # One explicit hook replaces the dead PlayerMove hook: total remains 10.
          assert text.count("@hook(") == 10
          assert text.count("add_hook(") == 3
          assert text.count("remove_hook(") == 3

          # Existing feature mutation surface remains narrow.
          assert text.count("pawn.SetWantsToSlide(True)") == 1
          assert text.count("pawn.SetWantsToSprint(True)") == 1
          assert text.count("pawn.SetWantsToSprint(False)") == 1
          assert text.count("pawn.SetWantsToSprint(wanted)") == 1
          assert text.count("component.AirControl =") == 3
          assert text.count("component.MaxSprintAngle =") == 2

          # Continuous handler must be edge-driven, not per-frame force.
          move_start = text.index("def _continuous_move_input(")
          move_end = text.index("def _remove_sprint_dynamic_hooks", move_start)
          move = text[move_start:move_end]
          assert 'if not active:' in move
          assert '_move_input_active = False' in move
          assert 'if _move_input_active:' in move
          assert '_move_input_active = True' in move
          assert move.count("_apply_auto_sprint_intent(pawn)") == 1

          # CDO/default fallback is required so discovery does not depend on a live Move ability.
          discover_start = text.index("def _discover_move_action_name(")
          discover_end = text.index("def _walk_override_mode", discover_start)
          discover = text[discover_start:discover_end]
          assert 'if ability is None and abilities:' in discover
          assert 'ability = abilities[0]' in discover
          assert 'name.lower() == "move"' in discover

          hooks_tuple = None
          for node in tree.body:
              if isinstance(node, ast.Assign) and any(
                  isinstance(t, ast.Name) and t.id == "HOOKS" for t in node.targets
              ):
                  hooks_tuple = node.value
                  break
          assert isinstance(hooks_tuple, ast.Tuple)
          names = [elt.id for elt in hooks_tuple.elts if isinstance(elt, ast.Name)]
          assert names == [
              "_continuous_move_input",
              "_set_wants_to_sprint",
              "_on_start_sprinting",
              "_on_end_sprinting",
              "_on_jumped",
              "_on_landed_post",
              "_movement_mode_changed",
              "_movement_component_mode_changed",
              "_set_wants_to_slide",
              "_client_restart",
          ], names

          meta = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          version = meta["project"]["version"]
          assert version == meta["tool"]["sdkmod"]["version"] == "1.3.4"

          stage = Path("stage/SnappyMovement")
          stage.mkdir(parents=True, exist_ok=True)
          for name in ("__init__.py","pyproject.toml","README.md","README_RU.md","LICENSE","ADDITIONAL_TERMS.md"):
              (stage/name).write_bytes(Path(name).read_bytes())

          archive = Path("dist/SnappyMovement.sdkmod")
          archive.parent.mkdir(exist_ok=True)
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for path in sorted(stage.rglob("*")):
                  if path.is_file():
                      zf.write(path, path.relative_to(stage.parent).as_posix())

          print("source_sha256", hashlib.sha256(source.read_bytes()).hexdigest())
          print("artifact_sha256", hashlib.sha256(archive.read_bytes()).hexdigest())
          print("AUTOSPRINT_CONTINUOUS_MOVE_V134_GATES_PASS")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: SnappyMovement-autosprint-continuous-move-v1.3.4
          path: dist/SnappyMovement.sdkmod
          if-no-files-found: error
