name: Temporary SnappyMovement sprint-slide snapshot diagnostic v1.0.4

on:
  push:
    branches:
      - diag-sprint-slide-snapshot-v1.0.4

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate proven-base snapshot diagnostic and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import ast, hashlib, tomllib, zipfile

          source = Path("__init__.py")
          text = source.read_text(encoding="utf-8")
          tree = ast.parse(text, filename=str(source))
          compile(text, str(source), "exec")

          # Proven SnappyMovement diagnostic lifecycle must remain present.
          for needle in (
              'ENABLE_BEFORE',
              'ENABLE_AFTER',
              'DISABLE_BEFORE',
              'DISABLE_AFTER',
              'RESTORE_BEGIN',
              'RESTORE_AFTER',
              'RESTORE_END',
              'CLIENT_RESTART_BEFORE',
              'CLIENT_RESTART_AFTER',
              'existing is component',
              '@hook("/Script/Engine.PlayerController:ClientRestart", Type.POST)',
          ):
              assert needle in text, needle

          # No fourth attempt at a generic runtime driver: manual keybind only.
          for forbidden in (
              "PlayerTick",
              "GameViewportClient:Tick",
              "OakPlayerController:InputKey",
          ):
              assert forbidden not in text, forbidden

          # No sprint/slide/crouch requests or writes in the probe.
          for forbidden in (
              "SetWantsToSlide(",
              "SetWantsToSprint(",
              "StartSprint(",
              "StartSprinting(",
              "StartSlide(",
              ".Crouch(",
              "bWantsToSprint =",
              "bWantsToSlide =",
              "MaxSprintSpeed =",
          ):
              assert forbidden not in text, forbidden

          assert 'snapshot_key = keybind(' in text
          assert '"SnappyMovement Diagnostic Snapshot"' in text
          assert '"F10"' in text
          assert 'keybinds=[snapshot_key]' in text
          assert 'SNAPSHOT_BEGIN' in text and 'SNAPSHOT_END' in text
          assert 'API_DUMP_BEGIN' in text and 'API_DUMP_END' in text
          assert 'SnappyMovement_Diagnostic.log' in text
          assert 'DIAG_VERSION = "1.0.4"' in text

          # Mechanically prove the only explicit Unreal hook is the already-proven ClientRestart.
          hook_paths = []
          for node in ast.walk(tree):
              if not isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                  continue
              for dec in node.decorator_list:
                  if not isinstance(dec, ast.Call):
                      continue
                  fn = dec.func
                  if isinstance(fn, ast.Name) and fn.id == "hook":
                      if dec.args and isinstance(dec.args[0], ast.Constant) and isinstance(dec.args[0].value, str):
                          hook_paths.append(dec.args[0].value)
          assert hook_paths == ["/Script/Engine.PlayerController:ClientRestart"], hook_paths

          meta = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          assert meta["project"]["version"] == meta["tool"]["sdkmod"]["version"] == "1.0.4"
          assert tuple(int(x) for x in meta["project"]["version"].split(".")) == (1, 0, 4)

          stage = Path("stage/SnappyMovement")
          stage.mkdir(parents=True, exist_ok=True)
          package_files = (
              "__init__.py",
              "pyproject.toml",
              "README.md",
              "README_RU.md",
              "LICENSE",
              "ADDITIONAL_TERMS.md",
          )
          for name in package_files:
              (stage / name).write_bytes(Path(name).read_bytes())

          archive = Path("dist/SnappyMovement.sdkmod")
          archive.parent.mkdir(exist_ok=True)
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for path in sorted(stage.rglob("*")):
                  if path.is_file():
                      zf.write(path, path.relative_to(stage.parent).as_posix())

          with zipfile.ZipFile(archive) as zf:
              names = [n for n in zf.namelist() if n and not n.endswith("/")]
              assert archive.stem == "SnappyMovement"
              assert {n.split("/", 1)[0] for n in names} == {"SnappyMovement"}
              assert len(names) == 6
              assert "SnappyMovement/__init__.py" in names
              assert not any("__pycache__" in n or n.endswith((".pyc", ".pyo")) for n in names)

          print("source_sha256", hashlib.sha256(source.read_bytes()).hexdigest())
          print("artifact_sha256", hashlib.sha256(archive.read_bytes()).hexdigest())
          print("PROVEN_BASE_SNAPSHOT_GATES_PASS")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: SnappyMovement-sprint-slide-snapshot-v1.0.4
          path: dist/SnappyMovement.sdkmod
          if-no-files-found: error
