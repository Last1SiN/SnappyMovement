name: Temporary SnappyMovement Air Control response v1.3.7

on:
  push:
    branches:
      - diag-aircontrol-response-v1.3.7
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate Air Control response diagnostic and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import ast, hashlib, tomllib, zipfile

          source = Path("__init__.py")
          text = source.read_text(encoding="utf-8")
          tree = ast.parse(text, filename=str(source))
          compile(text, "__init__.py", "exec")

          required = (
              "AIR_CONTROL_MIN = 0.6",
              '"air_control",\n    0.6,',
              "def _airresponse_movement_state(",
              "def _finish_airresponse(",
              "def _airresponse_tick(",
              "BPChar_Player_C:ReceiveTick",
              "relative <= 0.15",
              "relative >= 0.15",
              "[SnappyMovement airresponse]",
              "samples_ms_speed=",
              "max_accel=",
              "original_accel=",
              "_airresponse_tick,",
              '@hook("/Script/OakGame.OakCharacter:OnEndSprinting", Type.POST)',
              "_apply_auto_sprint_intent(obj)",
          )
          for needle in required:
              assert needle in text, needle

          for forbidden in (
              "safe_air_control = _safe_float_value(\n            air_control_option.value",
              "[SnappyMovement airproof]",
              "distance_xy=",
              "autosprintfix",
              "_PLAYER_MOVE_HOOK",
              "InputAction_Continuous_Vector_Impl",
              "PlayerTick",
              "GameViewportClient:Tick",
              "OakPlayerController:InputKey",
              "Velocity =",
              "MaxWalkSpeed =",
              "MaxSprintSpeed =",
          ):
              assert forbidden not in text, forbidden

          # Production had 9 explicit hooks; the only extra one is temporary ReceiveTick telemetry.
          assert text.count("@hook(") == 10
          assert text.count("add_hook(") == 3
          assert text.count("remove_hook(") == 3

          # Diagnostic adds no feature mutation.
          assert text.count("component.AirControl =") == 3
          assert text.count("component.MaxAcceleration =") == 2
          assert text.count("component.MaxSprintAngle =") == 2
          assert text.count("pawn.SetWantsToSlide(True)") == 1
          assert text.count("pawn.SetWantsToSprint(True)") == 1
          assert text.count("pawn.SetWantsToSprint(False)") == 1
          assert text.count("pawn.SetWantsToSprint(wanted)") == 1

          tick_start = text.index("def _airresponse_tick(")
          tick_end = text.index("def _finalize_landing_after_walking", tick_start)
          tick = text[tick_start:tick_end]
          assert "args.DeltaSeconds" in tick
          assert "_airresponse_movement_state(obj)" in tick
          assert "relative <= 0.15" in tick
          assert "relative >= 0.15" in tick
          assert "SetWantsTo" not in tick
          assert ".AirControl =" not in tick
          assert ".MaxAcceleration =" not in tick
          assert ".Velocity =" not in tick

          # No special persisted-value migration/sanitization for historical debug Air Control.
          sanitize_start = text.index("def _sanitize_loaded_settings(")
          sanitize_end = text.index("HOOKS = (", sanitize_start)
          sanitize = text[sanitize_start:sanitize_end]
          assert "safe_air_control" not in sanitize
          assert "current_air_control" not in sanitize

          hooks_tuple = None
          for node in tree.body:
              if isinstance(node, ast.Assign) and any(
                  isinstance(t, ast.Name) and t.id == "HOOKS" for t in node.targets
              ):
                  hooks_tuple = node.value
                  break
          assert isinstance(hooks_tuple, ast.Tuple)
          names = [elt.id for elt in hooks_tuple.elts if isinstance(elt, ast.Name)]
          assert names == [
              "_airresponse_tick",
              "_set_wants_to_sprint",
              "_on_start_sprinting",
              "_on_end_sprinting",
              "_on_jumped",
              "_on_landed_post",
              "_movement_mode_changed",
              "_movement_component_mode_changed",
              "_set_wants_to_slide",
              "_client_restart",
          ], names

          meta = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          assert meta["project"]["version"] == "1.3.7"
          assert meta["tool"]["sdkmod"]["version"] == "1.3.7"

          stage = Path("stage/SnappyMovement")
          stage.mkdir(parents=True, exist_ok=True)
          for name in ("__init__.py","pyproject.toml","README.md","README_RU.md","LICENSE","ADDITIONAL_TERMS.md"):
              (stage/name).write_bytes(Path(name).read_bytes())

          archive = Path("dist/SnappyMovement.sdkmod")
          archive.parent.mkdir(exist_ok=True)
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for path in sorted(stage.rglob("*")):
                  if path.is_file():
                      zf.write(path, path.relative_to(stage.parent).as_posix())

          print("source_sha256", hashlib.sha256(source.read_bytes()).hexdigest())
          print("artifact_sha256", hashlib.sha256(archive.read_bytes()).hexdigest())
          print("AIRCONTROL_RESPONSE_V137_GATES_PASS")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: SnappyMovement-aircontrol-response-v1.3.7
          path: dist/SnappyMovement.sdkmod
          if-no-files-found: error
