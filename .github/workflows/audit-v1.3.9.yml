name: Temporary SnappyMovement audit v1.3.9

on:
  push:
    branches:
      - audit-cleanup-v1.3.9
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Static no-slop audit and package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import ast, hashlib, re, tomllib, zipfile

          source = Path("__init__.py")
          text = source.read_text(encoding="utf-8")
          tree = ast.parse(text, filename=str(source))
          compile(text, "__init__.py", "exec")

          required = (
              "AIR_CONTROL_DEFAULT = 0.6",
              "AIR_CONTROL_MIN = AIR_CONTROL_DEFAULT",
              "MOVE_WALKING = 1",
              "MOVE_FALLING = 3",
              "if _same_uobject(record[0], component):",
              "def _sync_sprint_dynamic_hooks(",
              "and _walk_override_mode() != WALK_OVERRIDE_DISABLED",
              "_remove_sprint_dynamic_hooks()",
              "installed_paths = tuple(path for path, _identifier in _crouch_dynamic_hooks)",
              "bindings = _find_action_bindings",
              "_sync_sprint_dynamic_hooks(pawn, report_failure=True)",
              "_sync_sprint_dynamic_hooks(obj)",
              "if mode != MOVE_WALKING:",
              "if new_mode == MOVE_FALLING:",
              "elif new_mode == MOVE_WALKING:",
          )
          for needle in required:
              assert needle in text, needle

          forbidden = (
              "airresponse",
              "airproof",
              "airfix",
              "autosprintfix",
              "moveprobe",
              "movediag",
              "_PLAYER_MOVE_HOOK",
              "InputAction_Continuous_Vector_Impl",
              "ReceiveTick",
              "PlayerTick",
              "GameViewportClient:Tick",
              "OakPlayerController:InputKey",
              "Velocity =",
              "MaxWalkSpeed =",
              "MaxSprintSpeed =",
              "record[0] is component",
              "logging.warning",
          )
          for needle in forbidden:
              assert needle not in text, needle

          # Proven explicit hook and mutation surfaces stay unchanged.
          assert text.count("@hook(") == 9
          assert text.count("add_hook(") == 3
          assert text.count("remove_hook(") == 3
          assert text.count("component.AirControl =") == 3
          assert text.count("component.MaxAcceleration =") == 2
          assert text.count("component.BrakingDecelerationWalking =") == 2
          assert text.count("component.MaxSprintAngle =") == 2
          assert text.count("pawn.SetWantsToSlide(True)") == 1
          assert text.count("pawn.SetWantsToSprint(True)") == 1
          assert text.count("pawn.SetWantsToSprint(False)") == 1
          assert text.count("pawn.SetWantsToSprint(wanted)") == 1

          # No debug-only Air Control persisted-value migration.
          sanitize_start = text.index("def _sanitize_loaded_settings(")
          sanitize_end = text.index("HOOKS = (", sanitize_start)
          sanitize = text[sanitize_start:sanitize_end]
          assert "safe_air_control" not in sanitize
          assert "current_air_control" not in sanitize
          assert "air_control_option.value =" not in sanitize

          # Air Control lifecycle helper has no dead report_failure parameter.
          air_start = text.index("def _apply_air_control_override(")
          air_end = text.index("def _restore_all(", air_start)
          air_block = text[air_start:air_end]
          assert "report_failure" not in air_block

          # Partial dynamic-hook installs must be rejected and cleaned before retry.
          crouch_start = text.index("def _install_crouch_dynamic_hooks(")
          crouch_end = text.index("def _input_event_name(", crouch_start)
          crouch = text[crouch_start:crouch_end]
          assert "_CROUCH_INPUT_FN_4" in crouch and "_CROUCH_INPUT_FN_5" in crouch
          assert "_remove_crouch_dynamic_hooks()" in crouch

          sprint_start = text.index("def _install_sprint_dynamic_hooks(")
          sprint_end = text.index("def _sync_sprint_dynamic_hooks(", sprint_start)
          sprint = text[sprint_start:sprint_end]
          assert '"pressed" in _sprint_event_by_path.values()' in sprint
          assert '"released" in _sprint_event_by_path.values()' in sprint
          assert "_remove_sprint_dynamic_hooks()" in sprint

          # Sprint input hooks are owned only while Auto Sprint + walk override need them.
          sync_start = text.index("def _sync_sprint_dynamic_hooks(")
          sync_end = text.index("def _reset_flow_state(", sync_start)
          sync = text[sync_start:sync_end]
          assert "bool(auto_sprint_option.value)" in sync
          assert "_walk_override_mode() != WALK_OVERRIDE_DISABLED" in sync
          assert "_remove_sprint_dynamic_hooks()" in sync
          assert "_install_sprint_dynamic_hooks()" in sync

          auto_start = text.index("def _on_auto_sprint_change(")
          auto_end = text.index("def _on_walk_override_change(", auto_start)
          auto = text[auto_start:auto_end]
          assert "_sync_sprint_dynamic_hooks(pawn, report_failure=True)" in auto
          assert "_remove_sprint_dynamic_hooks()" in auto
          assert "_release_auto_sprint(pawn)" in auto

          # OnJumped must scope to the local pawn before any dynamic-hook work.
          jump_start = text.index("def _on_jumped(")
          jump_end = text.index("@hook(", jump_start)
          jump = text[jump_start:jump_end]
          local_check = jump.index("if not _same_uobject(obj, _get_current_pawn())")
          assert local_check < jump.index("_install_crouch_dynamic_hooks()")
          assert local_check < jump.index("_sync_sprint_dynamic_hooks(obj)")

          # No magic movement-mode comparisons remain in lifecycle code.
          assert "new_mode == 1" not in text
          assert "new_mode == 3" not in text
          assert "mode != 1" not in text

          # No dead top-level functions.
          top_defs = [n.name for n in tree.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))]
          loaded_names = [
              n.id for n in ast.walk(tree)
              if isinstance(n, ast.Name) and isinstance(n.ctx, ast.Load)
          ]
          for name in top_defs:
              assert name in loaded_names, f"unreferenced top-level function: {name}"

          # Basic source hygiene.
          assert "\t" not in text
          assert not re.search(r"\n{4,}", text)
          assert all(line == line.rstrip() for line in text.splitlines())

          # Metadata/docs must describe the actual feature set and license.
          meta = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          assert meta["project"]["version"] == "1.3.9"
          assert meta["tool"]["sdkmod"]["version"] == "1.3.9"
          desc = meta["project"]["description"].lower()
          for term in ("air control", "auto sprint", "directional sprint", "landing-slide"):
              assert term in desc, term

          readme = Path("README.md").read_text(encoding="utf-8")
          readme_ru = Path("README_RU.md").read_text(encoding="utf-8")
          for doc in (readme, readme_ru):
              for term in (
                  "Air Control",
                  "Auto Sprint",
                  "Sprint in All Directions",
                  "Remember Sprint",
                  "Crouch Landing Slide",
                  "MaxSprintAngle",
              ):
                  assert term in doc, term
              assert "0.6-20.0" in doc
              assert "Section 7" in doc

          # Package exactly the release payload.
          stage = Path("stage/SnappyMovement")
          stage.mkdir(parents=True, exist_ok=True)
          payload = ("__init__.py","pyproject.toml","README.md","README_RU.md","LICENSE","ADDITIONAL_TERMS.md")
          for name in payload:
              (stage/name).write_bytes(Path(name).read_bytes())

          archive = Path("dist/SnappyMovement.sdkmod")
          archive.parent.mkdir(exist_ok=True)
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              for path in sorted(stage.rglob("*")):
                  if path.is_file():
                      zf.write(path, path.relative_to(stage.parent).as_posix())

          with zipfile.ZipFile(archive) as zf:
              names = [n for n in zf.namelist() if n and not n.endswith("/")]
              assert {n.split("/", 1)[0] for n in names} == {"SnappyMovement"}
              assert sorted(n.split("/", 1)[1] for n in names) == sorted(payload)

          print("source_sha256", hashlib.sha256(source.read_bytes()).hexdigest())
          print("artifact_sha256", hashlib.sha256(archive.read_bytes()).hexdigest())
          print("AUDIT_V139_NO_SLOP_PASS")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: SnappyMovement-audit-v1.3.9
          path: dist/SnappyMovement.sdkmod
          if-no-files-found: error
